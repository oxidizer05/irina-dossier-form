<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Анкета-досье</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- ?v= — версия файлов. Меняете styles/app/data — увеличьте число,
     иначе браузер на площадке может подтянуть старую версию из кэша. -->
<link rel="stylesheet" href="styles.css?v=6">
<script>
/* Режим вида ставим ДО отрисовки, чтобы макет не «прыгал» при загрузке.
   auto — по ширине экрана, mobile/desktop — принудительно кнопкой. */
(function () {
  var v; try { v = localStorage.getItem('dossier-view'); } catch (e) {}
  var m = v === 'mobile' || (v !== 'desktop' && window.matchMedia('(max-width:900px)').matches);
  if (m) document.documentElement.className += ' m';
})();
</script>
</head>
<body>

<!-- ПАНЕЛЬ УПРАВЛЕНИЯ (правый верхний угол) -->
<div class="controls" id="controls">
  <button class="btn btn-fill" id="btnFill" title="Пробел — старт/пауза">
    <span class="dot"></span><span id="btnFillLabel">Автозаполнение</span>
  </button>
  <button class="btn btn-reset" id="btnReset" title="Esc — сброс">Сброс</button>
  <button class="btn btn-icon" id="btnKeys" title="Режим клавиш: печатает по нажатию любой клавиши" aria-label="Режим клавиш">
    <svg viewBox="0 0 24 16" width="20" height="14" aria-hidden="true"><rect x="1" y="1" width="22" height="14" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5 5.5h1M8.5 5.5h1M12 5.5h1M15.5 5.5h1M19 5.5h0M5 8.5h1M8.5 8.5h1M12 8.5h1M15.5 8.5h1M19 8.5h0M7.5 11.5h9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
  <button class="btn btn-icon" id="btnView" title="Телефонный / компьютерный вид" aria-label="Переключить вид">
    <svg class="ic-phone" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10.6 18.6h2.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    <svg class="ic-desk" viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 20.5h6M12 17v3.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
  <button class="btn btn-icon" id="btnTheme" title="Светлая / тёмная тема">◐</button>
  <a class="btn" id="btnDocs" href="hub.html" title="Открыть площадку с инструкциями">Инструкции</a>
  <button class="btn btn-icon" id="btnHide" title="Спрятать панель (H — вернуть)">✕</button>
</div>

<div class="page">

  <!-- ШАПКА -->
  <header class="head">
    <div class="head-left">
      <h1 class="ttl" id="hTitle">АНКЕТА-ДОСЬЕ ФИЗИЧЕСКОГО ЛИЦА</h1>
    </div>
    <div class="head-right">
      <div class="meta-row"><span>СТАТУС</span><b id="hStatus" class="st st-empty">НЕ ЗАПОЛНЕНО</b></div>
    </div>
  </header>

  <div class="progress"><i id="progressBar"></i></div>

  <!-- ТЕЛО -->
  <main class="body">

    <!-- ЛЕВАЯ КОЛОНКА: ФОТО -->
    <aside class="col-photo">
      <div class="fieldbox">
        <label class="lbl">Фото</label>
        <div class="photo" id="photo" tabindex="0" title="Нажмите или перетащите файл, чтобы вставить фото">
          <div class="photo-empty" id="photoEmpty">
            <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="23" r="11"/><path d="M10 58c2-13 11-19 22-19s20 6 22 19"/></svg>
            <span>ФОТО НЕ ЗАГРУЖЕНО</span>
            <small>нажмите или перетащите файл</small>
          </div>
          <img id="photoImg" alt="">
          <div class="scan" id="photoScan"></div>
        </div>
        <input type="file" id="photoInput" accept="image/*" hidden>
        <div class="photo-caption" id="photoCaption">ID 4472-К · ФОТО 1/1</div>
      </div>

      <div class="fieldbox">
        <label class="lbl" for="f_income">Ежемесячный доход</label>
        <input class="inp inp-big" id="f_income" data-field="income" autocomplete="off" spellcheck="false" placeholder="—">
      </div>
    </aside>

    <!-- ПРАВАЯ КОЛОНКА: ПОЛЯ -->
    <section class="col-fields">

      <div class="fieldbox span2">
        <label class="lbl" for="f_fio">ФИО</label>
        <input class="inp inp-big" id="f_fio" data-field="fio" autocomplete="off" spellcheck="false" placeholder="—">
      </div>

      <div class="fieldbox">
        <label class="lbl" for="f_birth">Дата рождения</label>
        <input class="inp mono" id="f_birth" data-field="birth" autocomplete="off" spellcheck="false" placeholder="—">
      </div>

      <div class="fieldbox">
        <label class="lbl" for="f_passport">Номер паспорта</label>
        <input class="inp mono" id="f_passport" data-field="passport" autocomplete="off" spellcheck="false" placeholder="—">
      </div>

      <div class="fieldbox">
        <label class="lbl" for="f_registered">Прописка</label>
        <input class="inp" id="f_registered" data-field="registered" autocomplete="off" spellcheck="false" placeholder="—">
      </div>

      <div class="fieldbox">
        <label class="lbl" for="f_phone">Номер телефона</label>
        <input class="inp mono" id="f_phone" data-field="phone" autocomplete="off" spellcheck="false" placeholder="—">
      </div>

      <div class="fieldbox">
        <label class="lbl" for="f_residence">Место жительства</label>
        <input class="inp" id="f_residence" data-field="residence" autocomplete="off" spellcheck="false" placeholder="—">
      </div>

      <div class="fieldbox">
        <label class="lbl" for="f_work">Место работы</label>
        <input class="inp" id="f_work" data-field="work" autocomplete="off" spellcheck="false" placeholder="—">
      </div>

      <div class="fieldbox span2">
        <label class="lbl">Социальные сети</label>
        <div class="chips" id="chips_social" data-field="social"></div>
      </div>

      <div class="fieldbox span2">
        <label class="lbl" for="f_relatives">Ближайшие родственники</label>
        <textarea class="inp ta" id="f_relatives" data-field="relatives" rows="4" spellcheck="false" placeholder="—"></textarea>
      </div>

      <div class="fieldbox span2">
        <label class="lbl">Банки</label>
        <div class="chips" id="chips_banks" data-field="banks"></div>
      </div>

    </section>
  </main>

  <footer class="foot">
    <span>ДОКУМЕНТ СФОРМИРОВАН АВТОМАТИЧЕСКИ · КОПИРОВАНИЕ ЗАПРЕЩЕНО</span>
    <span class="caret-blink">СЕАНС АКТИВЕН</span>
  </footer>
</div>

<div class="hint" id="hint">Панель скрыта · <b>H</b> — вернуть · <b>Пробел</b> — старт/пауза · <b>Esc</b> — сброс</div>

<script src="data.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
